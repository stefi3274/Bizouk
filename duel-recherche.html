<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Défier un joueur · BiZouk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1b21">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16">

</head>
<body>

<header>
  <div class="nav">
    <a href="index.html" class="logo"><img src="icons/icon-192.png" alt="BiZouk" class="logo-mark"><span class="logo-txt">Bi<b>Zouk</b></span></a>
    <nav class="nav-liens"><a href="duels.html">Duels</a></nav>
    <a href="connexion.html" class="btn-connexion" id="navAuth">Se connecter</a>
  </div>
</header>

<main class="page" id="ecranRecherche" style="max-width:520px">
  <div style="text-align:center;margin-bottom:20px">
    <p class="page-kicker" style="text-align:center">🔍 Défier un joueur</p>
    <h1 style="font-family:var(--serif);font-size:clamp(1.6rem,5vw,2.1rem);color:var(--blanc)">Trouve un adversaire</h1>
    <p style="color:var(--texte-doux);margin-top:6px">Cherche par pseudo (il faut qu'il ait déjà joué au moins une grille).</p>
  </div>

  <div class="form-carte">
    <div class="field">
      <label>Pseudo</label>
      <input type="text" id="rechPseudo" placeholder="Ex. Stevenson" autocomplete="off">
    </div>
    <div id="rechResultats"></div>
  </div>

  <div class="form-carte" id="choixCarte" style="display:none;margin-top:16px">
    <p style="color:var(--texte-doux);margin-bottom:12px">Défier <b id="cibleNom" style="color:var(--blanc)"></b> sur :</p>
    <div class="field"><label>Grille</label>
      <select id="selChapitre"><option value="">Chargement…</option></select>
    </div>
    <div class="field"><label>Niveau</label>
      <select id="selNiveau">
        <option value="1">Niveau 1 · 6 mots</option>
        <option value="2">Niveau 2 · 7 mots</option>
        <option value="3">Niveau 3 · 8 mots</option>
        <option value="4">Niveau 4 · 9 mots</option>
        <option value="5" selected>Niveau 5 · 10 mots</option>
      </select>
    </div>
    <button class="btn btn-v" id="btnJouerDefi" style="width:100%">Jouer et envoyer le défi</button>
  </div>
</main>

<!-- Le jeu -->
<main class="jeu" id="ecranJeu" style="display:none">
  <div class="jeu-head">
    <div class="jeu-titre"><h1 id="jeuTitre">Défi</h1><div class="jeu-meta" id="jeuMeta"></div></div>
    <div class="jeu-stats no-print">
      <div class="stat chrono"><b id="chrono">0:00</b><span>Temps</span></div>
      <div class="stat"><b id="statTrouves">0</b><span>Trouvés</span></div>
      <div class="stat"><b id="statRestants">0</b><span>Restants</span></div>
    </div>
  </div>
  <div class="jeu-corps">
    <div class="grille-box"><div class="grille" id="grille"></div></div>
    <div class="mots-box">
      <h3>Mots à trouver</h3>
      <div class="mots-progres" id="motsProgres">—</div>
      <div class="mots-liste" id="motsListe"></div>
    </div>
  </div>
</main>

<!-- Confirmation -->
<div class="victoire" id="resultat">
  <div class="vic-carte" style="max-width:440px">
    <div class="vic-emoji">📨</div>
    <h2>Défi <b>envoyé</b></h2>
    <p class="vic-sous" id="resSous"></p>
    <div class="vic-actions" style="margin-top:16px">
      <a class="btn btn-v btn-sm" href="duels.html">Voir mes duels</a>
      <a class="btn btn-g btn-sm" href="index.html">Retour</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/progression.js"></script>
<script src="js/son.js"></script>
<script src="js/moteur.js"></script>
<script src="js/confetti.js"></script>
<script src="js/duel.js"></script>
<script src="js/duel-recherche.js"></script>
<script src="js/retour.js"></script>
<script src="js/pwa.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
