<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duel Mode classique · BiZouk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1b21">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16">

</head>
<body>

<header>
  <div class="nav">
    <a href="index.html" class="logo"><img src="icons/icon-192.png" alt="BiZouk" class="logo-mark"><span class="logo-txt">Bi<b>Zouk</b></span></a>
    <nav class="nav-liens"><a href="duels.html">Duels</a></nav>
    <a href="connexion.html" class="btn-connexion" id="navAuth">Se connecter</a>
  </div>
</header>

<!-- Écran d'accueil du défi -->
<main class="duel-arene" id="ecranDefi">
  <div style="text-align:center;margin-bottom:14px">
    <p class="page-kicker" style="text-align:center">🕵️ Duel Mode classique</p>
    <h1 id="defiTitre" style="font-family:var(--serif);font-size:clamp(1.7rem,5vw,2.2rem);color:var(--blanc)">Chargement…</h1>
    <p style="color:var(--texte-doux);margin-top:6px" id="defiSous"></p>
  </div>
  <div class="form-carte" style="max-width:420px;margin:0 auto;text-align:center">
    <p style="color:var(--texte-doux);margin-bottom:14px">Mêmes mots, message mystère à révéler. Ton nom :</p>
    <input type="text" id="duelNom" placeholder="Ton pseudo" maxlength="20" style="margin-bottom:14px">
    <button class="btn btn-v" id="btnRelever" style="width:100%">Relever le défi</button>
  </div>
</main>

<!-- Compte à rebours -->
<div class="rebours" id="rebours">
  <div class="rebours-nb" id="reboursNb">3</div>
  <div class="rebours-txt" id="reboursTxt">Prépare-toi…</div>
</div>

<!-- Le jeu -->
<main class="jeu" id="ecranJeu" style="display:none">
  <div class="jeu-head">
    <div class="jeu-titre">
      <h1>Duel Mode classique</h1>
      <div class="jeu-meta" id="chrono">0:00</div>
    </div>
  </div>

  <div class="mystere-banniere" id="mystereBanniere" style="display:none">
    🔎 Message mystère : <span id="mystereTexte"></span>
  </div>

  <div class="jeu-corps">
    <div class="grille-box"><div class="grille" id="grille"></div></div>
    <div class="mots-box">
      <h3>Mots à trouver</h3>
      <div class="mots-progres" id="motsProgres">—</div>
      <div class="mots-liste" id="motsListe"></div>
    </div>
  </div>
</main>

<!-- Résultat -->
<div class="victoire" id="resultat">
  <div class="vic-carte" style="max-width:460px">
    <div class="vic-emoji" id="resEmoji">🕵️</div>
    <h2 id="resTitre">Résultat</h2>
    <div id="resContenu"></div>
    <div class="vic-actions" style="margin-top:20px">
      <a class="btn btn-g btn-sm" href="index.html">Retour</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/son.js"></script>
<script src="js/mots-mystere.js"></script>
<script src="js/moteur.js"></script>
<script src="js/confetti.js"></script>
<script src="js/duel-classique.js"></script>
<script src="js/duel-classique-page.js"></script>
<script src="js/retour.js"></script>
<script src="js/pwa.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
