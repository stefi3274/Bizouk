<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jouer · BiZouk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1b21">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16">

</head>
<body>

<header class="no-print">
  <div class="nav nav-jeu"></div>
</header>

<main class="jeu">
  <div class="jeu-head">
    <div class="jeu-titre">
      <h1 id="jeuTitre">Chargement…</h1>
      <div class="jeu-meta" id="jeuMeta"></div>
    </div>
    <div class="jeu-stats no-print" style="display:none">
      <div class="stat chrono" id="statChrono"><b id="chrono">0:00</b><span>Temps</span></div>
      <div class="stat"><b id="statTrouves">0</b><span>Trouvés</span></div>
      <div class="stat"><b id="statRestants">0</b><span>Restants</span></div>
    </div>
  </div>

  <div class="jeu-corps">
    <div class="grille-box">
      <div class="grille" id="grille"></div>
    </div>
    <div class="mots-box">
      <h3>Mots à trouver</h3>
      <div class="mots-progres" id="motsProgres">—</div>
      <div class="mots-liste" id="motsListe"></div>
    </div>
  </div>

  <div class="jeu-actions no-print">
    <button class="btn btn-v btn-sm btn-indice" id="btnIndice">
      Indice <span class="bi-cout" id="coutIndice">1 ◆</span>
    </button>
    <button class="btn btn-g btn-sm" id="btnNouvelle">Nouvelle grille</button>
    <button class="btn btn-g btn-sm" id="btnRecommencer">Recommencer</button>
    <button class="btn btn-g btn-sm" id="btnImprimer">Imprimer</button>
    <a class="btn btn-g btn-sm" href="index.html">Changer de niveau</a>
  </div>
</main>

<!-- Écran de victoire -->
<div class="victoire on" id="introJeu">
  <div class="vic-carte" style="max-width:380px">
    <button type="button" class="info-app-fermer" id="btnFermerIntro" aria-label="Fermer" style="position:absolute;top:14px;right:16px">✕</button>
    <div class="mg-grille">
      <span class="mg-c mg-w1">B</span><span class="mg-c mg-w1">I</span><span class="mg-c mg-w1">Z</span><span class="mg-c mg-w1">O</span><span class="mg-c mg-w1">U</span><span class="mg-c mg-w1">K</span><span class="mg-c">R</span>
      <span class="mg-c">A</span><span class="mg-c mg-w2">J</span><span class="mg-c">M</span><span class="mg-c">E</span><span class="mg-c">S</span><span class="mg-c">T</span><span class="mg-c">L</span>
      <span class="mg-c">N</span><span class="mg-c mg-w2">O</span><span class="mg-c">R</span><span class="mg-c">A</span><span class="mg-c">U</span><span class="mg-c">D</span><span class="mg-c">X</span>
      <span class="mg-c">C</span><span class="mg-c mg-w2">U</span><span class="mg-c">V</span><span class="mg-c">I</span><span class="mg-c">N</span><span class="mg-c">Q</span><span class="mg-c">P</span>
      <span class="mg-c">T</span><span class="mg-c mg-w2">E</span><span class="mg-c">S</span><span class="mg-c">N</span><span class="mg-c">O</span><span class="mg-c">I</span><span class="mg-c">R</span>
      <span class="mg-c mg-w3">M</span><span class="mg-c mg-w3">O</span><span class="mg-c mg-w3">T</span><span class="mg-c mg-w3">S</span><span class="mg-c">A</span><span class="mg-c">B</span><span class="mg-c">I</span>
    </div>
    <p class="hero-visuel-legende" style="margin-top:14px">Un mot t'attend.</p>
    <button type="button" class="btn btn-v btn-sm" id="btnCommencerIntro" style="margin-top:16px">C'est parti !</button>
  </div>
</div>

<div class="victoire" id="apercuMots">
  <div class="vic-carte">
    <div class="vic-emoji">🔎</div>
    <h2>Les mots à <b>trouver</b></h2>
    <p class="vic-sous" id="apercuSous">—</p>
    <div class="apercu-liste" id="apercuListe"></div>
    <div class="vic-actions">
      <button class="btn btn-v" id="btnCommencer">Commencer !</button>
      <button class="btn btn-g btn-sm" id="btnDefierAvant" style="display:none">🎯 Défier un ami</button>
    </div>
  </div>
</div>

<div class="victoire" id="victoire">
  <div class="vic-carte">
    <div class="vic-emoji">🎉</div>
    <h2>Grille <b>terminée</b></h2>
    <div class="vic-temps" id="vicTemps">0:00</div>
    <p class="vic-sous" id="vicSous">Tous les mots trouvés</p>
    <div class="vic-invite" id="vicInvite"></div>
    <div class="vic-actions">
      <button class="btn btn-v btn-sm" id="vicRejouer">Nouvelle grille</button>
      <a class="btn btn-g btn-sm" href="index.html">Retour</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/pierre.js"></script>
<script src="js/progression.js"></script>
<script src="js/sauvegarde.js"></script>
<script src="js/son.js"></script>
<script src="js/moteur.js"></script>
<script src="js/confetti.js"></script>
<script src="js/partage.js"></script>
<script src="js/duel.js"></script>
<script src="js/jeu.js"></script>
<script src="js/retour.js"></script>
<script src="js/pwa.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
